[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palate-multiome-priming"
version = "0.1.0"
description = "Is anterior/posterior fate primed in chromatin before transcription? A reanalysis of GSE218576."
authors = [{name = "Nguyen Thi Thuy Linh"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "h5py>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "leidenalg>=0.10",
    "igraph>=0.11",
]

[project.urls]
Homepage = "https://github.com/NguyenLinh225/palate-multiome-priming"
Repository = "https://github.com/NguyenLinh225/palate-multiome-priming"
Data = "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE218576"

[project.optional-dependencies]
# what CI needs: tests and lint only, so the 3.10 matrix leg stays installable
dev = ["pytest>=7.4", "ruff>=0.4"]
# running the full workflow; snakemake 8+ requires Python >= 3.11
workflow = ["snakemake>=8.0; python_version >= '3.11'", "python-pptx>=0.6", "jupyter>=1.0"]
atac = ["pysam>=0.22", "pyranges>=0.0.129"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# C408: matplotlib prop dicts read better as dict(...) than as literals.
ignore = ["C408"]

[tool.ruff.lint.per-file-ignores]
# Slide copy is wrapped across lines inside tuples by design.
"scripts/05_build_deck.py" = ["ISC004"]
